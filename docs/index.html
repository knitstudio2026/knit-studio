<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#faf7f2">
<meta name="description" content="一人多店毛衣电商效率工具：利润核算 + AI换装出图">
<title>编织台 · 毛衣电商效率工具</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/app.css?v=1156X">
</head>
<body>
<div id="authScreen" class="auth-screen" hidden style="display:none">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true"><path d="M14 8h20l4 6v26H10V14z" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M14 8v26M34 8v26" stroke="currentColor" stroke-width="1.6" opacity=".45"/><path d="M10 20h28" stroke="currentColor" stroke-width="1.6" opacity=".45"/></svg>
    </div>
    <h1>编织台</h1>
    <p class="auth-sub" id="authSub">请输入访问口令，手机与电脑共用同一份数据</p>
    <input id="authInput" type="password" inputmode="text" autocomplete="current-password" placeholder="访问口令" />
    <button id="authBtn" class="btn primary block">进入</button>
    <p class="auth-tip" id="authTip">首次进入会自动设置口令，请牢记。</p>
  </div>
</div>

<div id="shell" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="20" height="20"><path d="M14 8h20l4 6v26H10V14z" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M14 8v26M34 8v26M10 20h28" stroke="currentColor" stroke-width="1.4" opacity=".5"/></svg>
      </span>
      <span class="brand-name">编织台</span>
    </div>
    <div class="topbar-meta">
      <span class="sync-dot" id="syncDot" title="同步状态"></span>
      <span class="sync-text" id="syncText">已同步</span>
    </div>
    <button class="icon-btn" id="logoutBtn" title="退出登录">退出</button>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab" data-route="dashboard">看板</button>
    <button class="tab" data-route="products">利润</button>
    <button class="tab" data-route="studio">AI换装</button>
    <button class="tab" data-route="shops">店铺</button>
    <button class="tab" data-route="settings">设置</button>
  </nav>

  <main id="view" class="view"></main>
</div>

<div id="toast" class="toast" hidden></div>
<script src="js/local-api.js?v=1156X"></script>
<script type="module" src="js/app.js?v=1156Z"></script>
</body>
</html>
