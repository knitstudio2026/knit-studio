<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方舟连通性测试</title>
<style>
  body{font-family:system-ui,sans-serif;padding:24px;background:#f5f5f7;color:#1d1d1f}
  button{font-size:18px;padding:12px 22px;border-radius:10px;border:0;background:#07c160;color:#fff;font-weight:700}
  #out{margin-top:18px;padding:16px;background:#fff;border-radius:12px;white-space:pre-wrap;line-height:1.6;min-height:80px}
  .ok{color:#0a7d33}.bad{color:#d93025}
</style>
</head>
<body>
  <h2>方舟接口连通性测试</h2>
  <p>点下面按钮：用无效密钥请求方舟生图接口，只看浏览器能不能读到返回内容。</p>
  <button id="btn">开始测试</button>
  <div id="out">等待测试…</div>
<script>
document.getElementById('btn').onclick = async () => {
  const out = document.getElementById('out');
  out.className = '';
  out.textContent = '请求中…';
  try {
    const res = await fetch('https://ark.cn-beijing.volces.com/api/v3/images/generations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer invalid-test-key' },
      body: JSON.stringify({ model: 'test', prompt: 'test', size: '1024x1024' })
    });
    let txt = '';
    try { txt = await res.text(); } catch (e) { txt = '(读不到内容) ' + e.message; }
    out.className = 'ok';
    out.textContent = '能读到返回，HTTP ' + res.status + '\n' + txt.slice(0, 500);
  } catch (e) {
    out.className = 'bad';
    out.textContent = '被浏览器跨域拦截（CORS），读不到任何返回\n' + e.message;
  }
};
</script>
</body>
</html>
